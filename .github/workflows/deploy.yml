# Publica HogarApp en Firebase cada vez que algo llega a main.
# Hace lo mismo que correr `npm run build && firebase deploy` en una compu,
# pero en un servidor de GitHub, así no hace falta la máquina de nadie.
#
# Autenticación SIN llaves descargadas (Workload Identity Federation): GitHub
# le prueba a Google quién es y Google le da un pase que dura minutos. Es lo
# que exigen las organizaciones con iam.disableServiceAccountKeyCreation.
#
# Necesita estos secrets del repo (Settings → Secrets and variables → Actions):
#   GCP_WIF_PROVIDER     · projects/<NÚMERO>/locations/global/workloadIdentityPools/github/providers/github
#   GCP_SERVICE_ACCOUNT  · github-deploy@<project-id>.iam.gserviceaccount.com
#   VITE_FB_API_KEY, VITE_FB_AUTH_DOMAIN, VITE_FB_PROJECT_ID,
#   VITE_FB_APP_ID, VITE_FB_SENDER_ID  · los mismos valores del .env.local
name: Deploy a Firebase

on:
  push:
    branches: [main]
  # Botón para publicar a mano desde la pestaña Actions
  workflow_dispatch:

# Un deploy por vez: si se pisan dos, el segundo espera
concurrency:
  group: deploy-firebase

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Deja que GitHub emita el carnet de identidad que Google verifica
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Compilar la app (incluye typecheck)
        run: npm run build
        env:
          VITE_FB_API_KEY: ${{ secrets.VITE_FB_API_KEY }}
          VITE_FB_AUTH_DOMAIN: ${{ secrets.VITE_FB_AUTH_DOMAIN }}
          VITE_FB_PROJECT_ID: ${{ secrets.VITE_FB_PROJECT_ID }}
          VITE_FB_APP_ID: ${{ secrets.VITE_FB_APP_ID }}
          VITE_FB_SENDER_ID: ${{ secrets.VITE_FB_SENDER_ID }}

      # Canjea el carnet de GitHub por un pase temporal de Google.
      # Deja GOOGLE_APPLICATION_CREDENTIALS apuntando a ese pase.
      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # hosting = los archivos de la app · firestore:rules = los permisos de la base
      - name: Publicar hosting y reglas de Firestore
        run: >
          npx firebase deploy
          --only hosting,firestore:rules
          --project "${{ secrets.VITE_FB_PROJECT_ID }}"
          --non-interactive
